name: Deploy Chomper

# The AWS side of ingestion: the SQS queue, dead-letter queue and alarms. The
# worker that drains the queue runs on the production host and ships from
# build-chomper.yml.
on:
  push:
    branches: [main]
    paths:
      - "apps/chomper/template.yaml"
      - ".github/workflows/deploy-chomper.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate template
        run: aws cloudformation validate-template --template-body file://apps/chomper/template.yaml > /dev/null

      - name: Deploy Chomper stack
        run: |
          aws cloudformation deploy --template-file apps/chomper/template.yaml \
            --stack-name lfstats-chomper \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              IncomingBucket=${{ secrets.INCOMING_BUCKET }} \
              ErrorEmailAddress=${{ secrets.ERROR_EMAIL_ADDRESS }}

      # The notification lives on the bucket, not in the stack, so it is
      # re-applied on every deploy to keep it pointed at the queue.
      - name: Configure S3 bucket notification
        run: |
          QUEUE_ARN=$(aws cloudformation describe-stacks --stack-name lfstats-chomper --query "Stacks[0].Outputs[?OutputKey=='ChomperQueueArn'].OutputValue" --output text)
          aws s3api put-bucket-notification-configuration \
            --bucket ${{ secrets.INCOMING_BUCKET }} \
            --notification-configuration "{\"QueueConfigurations\": [{\"QueueArn\": \"$QUEUE_ARN\", \"Events\": [\"s3:ObjectCreated:*\"], \"Filter\": {\"Key\": {\"FilterRules\": [{\"Name\": \"suffix\", \"Value\": \".tdf\"}]}}}]}"
