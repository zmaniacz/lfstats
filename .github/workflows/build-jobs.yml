name: build-jobs
on:
  push:
    branches: [main]
    paths:
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-jobs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/zmaniacz/lfstats-jobs
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pull only — nothing is started here. The recompute is invoked by cron on the
  # deploy host (see docs/build-and-deploy.md); this step just makes sure the
  # image sitting on that host is the current one when cron next fires.
  pull:
    needs: build
    runs-on: [self-hosted, lfstats-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull jobs image
        working-directory: /opt/lfstats-web
        run: docker compose pull jobs
      - name: Prune dangling images
        run: docker image prune -f
      - name: Logout
        if: always()
        run: docker logout ghcr.io
