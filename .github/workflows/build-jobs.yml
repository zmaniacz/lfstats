name: build-jobs
on:
  push:
    branches: [main]
    paths:
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-jobs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/zmaniacz/lfstats-jobs
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
# Build and push only — nothing is deployed or started from here.
#
# There is deliberately no self-hosted job pulling the image onto the deploy
# host. The cron entry pulls immediately before it runs (see
# docs/build-and-deploy.md § Scheduled Jobs), which keeps this workflow
# independent of host-side compose configuration: a pull step here would fail on
# every push until the `jobs` service exists in the host's docker-compose.yml,
# and would then be one more thing to keep in sync with it.
