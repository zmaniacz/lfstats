AWSTemplateFormatVersion: 2010-09-09
Description: AWS side of Chomper ingestion - the upload queue the home worker pulls from, and its alarms.
Resources:
  ChomperDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: lfstats-chomper-dlq
      MessageRetentionPeriod: 1209600

  # S3 upload events for the home worker to pull. Files wait here through a
  # home server outage, for as long as SQS allows (14 days).
  ChomperQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: lfstats-chomper-incoming
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ChomperDeadLetterQueue.Arn
        maxReceiveCount: 5

  ChomperQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ChomperQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ChomperQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:aws:s3:::${IncomingBucket}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ChomperErrorTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: lfstats-chomper-errors

  ChomperErrorSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref ErrorEmailAddress
      TopicArn: !Ref ChomperErrorTopic

  ChomperDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Send an email when Chomper dead-letter queue receives a message."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ChomperDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref ChomperErrorTopic
      TreatMissingData: missing

  # Also the "home worker is down" alarm: nothing else is watching it from AWS.
  ChomperQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Send an email when uploaded TDF files have waited over an hour for the Chomper worker."
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ChomperQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3600
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref ChomperErrorTopic
      TreatMissingData: notBreaching

Parameters:
  IncomingBucket:
    Type: String
    Description: S3 bucket name where TDF files are uploaded.

  ErrorEmailAddress:
    Type: String
    Description: Email address that receives Chomper failure notifications.

Outputs:
  ChomperQueueUrl:
    Description: Value for the worker's CHOMPER_QUEUE_URL.
    Value: !Ref ChomperQueue

  ChomperQueueArn:
    Description: Destination for the incoming bucket's S3 notification.
    Value: !GetAtt ChomperQueue.Arn
